<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Product review form for sharing your experience and rating a product.">
    <meta name="author" content="Reeta Pun">

    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

    </head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <!-- Product Name -->
            <label for="productName">Product Name:</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product</option>
                </select>
                
                <!-- Overall Rating -->
                 <fieldset>
                    <legend>Overall Rating</legend>
                    <div class="rating">
                        <label for="rating1">
                            <span>☆</span>
                            <input type="radio" id="rating1" name="rating" value="1" required>
                        </label>
                        <label for="rating2">
                            <span>☆☆</span>
                            <input type="radio" id="rating2" name="rating" value="2" required>
                        </label>
                        
                        <label for="rating3">
                            <span>☆☆☆</span>
                            <input type="radio" id="rating3" name="rating" value="3" required>
                        </label>
                        
                        <label for="rating4">
                            <span>☆☆☆☆</span>
                            <input type="radio" id="rating4" name="rating" value="4" required>
                        </label>
                        <label for="rating5">
                            <span>☆☆☆☆☆</span>
                            <input type="radio" id="rating5" name="rating" value="5" required>
                        </label>
                    </div>
                </fieldset>
                
                <!-- Date of Installation -->
                 <label for="installDate">Date of Installation</label>
                 <input type="date" id="installDate" name="installDate" required>
                 
                 <!-- Useful Features -->
                  
                 <fieldset>
                    <legend>
                        Which features did you find useful in the product?
                        <em>(Check all that apply)</em>
                    </legend>
                    
                    <label for="durability">
                        <input type="checkbox" id="durability" name="features" value="durability">
                        Durability
                    </label>
                    <label for="easeOfUse">
                        <input type="checkbox" id="easeOfUse" name="features" value="ease-of-use">
                        Ease of Use
                    </label>
                    <label for="performance">
                        <input type="checkbox" id="performance" name="features" value="performance">
                        Performance
                    </label>
                    <label for="design">
                        <input type="checkbox" id="design" name="features" value="design">
                        Design
                    </label>
                </fieldset>
                <!-- Written Review -->
                 <label for="writtenReview">
                    Written Review <span>(Optional)</span>
                </label>
                
                <textarea id="writtenReview" name="writtenReview" rows="6"></textarea>
                
                <!-- User Name -->
                 <label for="userName">
                    Your Name <span>(Optional)</span>
                </label>
                
                <input type="text" id="userName" name="userName">
                
                <!-- Submit Button -->
                 
                <input type="submit" value="Post Review">
            
            </form>
        </main>
        
        <footer>
            <p>&copy; <span id="currentyear"></span> Reeta Pun</p>
            <p id="lastModified"></p>
        </footer>
    
    </body>
</html>
